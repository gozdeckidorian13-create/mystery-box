<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mystery Box</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="home">

<h1>🎁 Mystery Box</h1>

<p>Wybierz skrzynię</p>

<div class="boxes">

<div class="box basic" onclick="openBox('basic')">
<h2>📦 BASIC</h2>
<p>30 przedmiotów</p>
</div>

<div class="box standard" onclick="openBox('standard')">
<h2>📦 STANDARD</h2>
<p>20 przedmiotów</p>
</div>

<div class="box epic" onclick="openBox('epic')">
<h2>📦 EPIC</h2>
<p>10 przedmiotów</p>
</div>

</div>

</div>


<div id="boxPage" style="display:none;">

<button onclick="backHome()">⬅ Powrót</button>

<h1 id="boxTitle"></h1>

<h2>Możliwe nagrody</h2>

<div id="dropList"></div>

<br>

<button id="openBtn" onclick="startOpening()">
OTWÓRZ
</button>

<div id="animation"></div>

<h2 id="result"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
